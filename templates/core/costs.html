<div class="bill-line"><span>Food subtotal</span><span>₹{{ costs.subtotal }}</span></div><div class="bill-line"><span>Delivery</span><span>₹{{ costs.delivery_fee }}</span></div><div class="bill-line"><span>Platform fee (demo)</span><span>₹{{ costs.platform_fee }}</span></div><div class="bill-line"><span>Tax (5% demo)</span><span>₹{{ costs.tax }}</span></div>{% if costs.discount %}<div class="bill-line saving"><span>Coupon savings</span><span>− ₹{{ costs.discount }}</span></div>{% endif %}<div class="bill-line total-line"><b>Total</b><b>₹{{ costs.total }}</b></div><small class="muted">Illustrative INR demo charges.</small>
